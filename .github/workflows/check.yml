# make check on Ubuntu (Lean only: no Swift, no host), building against the registry as a person
# would: Lake fetches Cairn and cairn_json from https://cairn.registry.nexthub.sh. No secrets.
# Bun runs the fake PDS (tools/fake-pds/) on 127.0.0.1 for the replay; nothing leaves the runner.
name: check

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: check-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4

      - name: Lean
        run: |
          curl -sSfL https://raw.githubusercontent.com/leanprover/elan/master/elan-init.sh | sh -s -- -y --default-toolchain none
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"

      - name: Bun (the fake PDS's server and replay)
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Cache Lean builds
        uses: actions/cache@v4
        with:
          path: |
            ~/.elan
            lean/.lake
          key: lean-${{ runner.os }}-${{ hashFiles('lean/lean-toolchain', 'lean/lake-manifest.json') }}
          restore-keys: lean-${{ runner.os }}-

      - name: make check
        run: make check
